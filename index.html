<!DOCTYPE html>
<html lang="id" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Overlay View - Tahfidz Overlay</title>
  <style>
    @font-face {
      font-family: 'LPMQ Isep Misbah';
      src: url('fonts/LPMQ Isep Misbah/LPMQ Isep Misbah.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Amiri';
      src: url('fonts/Amiri-Regular.ttf') format('truetype');
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: var(--vertical-align, center);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #overlay {
      direction: rtl;
      background: rgba(0, 0, 0, 0.7);
      padding: var(--overlay-padding, 30px 50px);
      border-radius: 20px;
      text-align: var(--text-align, center);
      max-width: var(--overlay-width, 85vw);
      max-height: 85vh;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 1;
      transform: scale(1);
    }

    #overlay.hidden {
      opacity: 0;
      transform: scale(0.95) translateY(20px);
      pointer-events: none;
    }

    .surah {
      font-size: var(--surah-size, 24px);
      color: #FFD166;
      margin-bottom: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
      border-bottom: 1px solid rgba(255, 209, 102, 0.2);
      padding-bottom: 10px;
      direction: ltr;
    }

    .verse {
      font-family: 'LPMQ Isep Misbah', 'Amiri', serif;
      font-size: var(--verse-size, 64px);
      line-height: var(--line-height, 1.6);
      color: #fff;
      margin: 20px 0;
    }

    .verse span.reading {
      color: var(--highlight-color, #FFD166);
      transition: all 0.3s ease;
    }

    .verse span.reading.wrong {
      color: #ff595e;
      animation: blink-red 0.6s step-end infinite;
    }

    @keyframes blink-red {
      0%, 100% { color: #ff595e; }
      50% { color: #fff; }
    }


    .translation {
      font-size: var(--trans-size, 24px);
      color: #FFD166;
      font-style: italic;
      margin-top: 15px;
      font-family: 'Inter', sans-serif;
      line-height: 1.4;
      display: var(--trans-display, block);
      border-top: 1px solid rgba(255, 209, 102, 0.2);
      padding-top: 15px;
      direction: ltr;
    }
  </style>
</head>

<body>
  <div id="overlay" class="hidden">
    <div class="surah" id="surah">Memuat...</div>
    <div class="verse" id="verse">...</div>
    <div class="translation" id="translation">...</div>
  </div>

  <script>
    const SURAH_LIST_FILE = 'data/surah_list.json';
    const QURAN_JSON_PATH = 'quran-json/surah/';

    let surahList = [];
    let surahCache = {};
    let lastSyncTime = 0;
    let isPolling = false;
    let currentWordIndex = -1;

    const overlay = document.getElementById('overlay');
    const elSurah = document.getElementById('surah');
    const elVerse = document.getElementById('verse');
    const elTrans = document.getElementById('translation');

    let settings = {
      verseSize: 64,
      surahSize: 24,
      transSize: 24,
      lineHeight: 1.6,
      overlayWidth: 85,
      overlayPadding: 30,
      maxWords: 0,
      textAlign: 'center',
      verticalAlign: 'center',
      transLang: 'id',
      transDisplay: 'block'
    };

    function init() {
      fetch(SURAH_LIST_FILE)
        .then(res => res.json())
        .then(data => {
          surahList = data;
          pollSync();
        });
    }

    function loadSurah(no) {
      if (surahCache[no]) return Promise.resolve(surahCache[no]);
      return fetch(`${QURAN_JSON_PATH}${no}.json`)
        .then(res => res.json())
        .then(data => {
          surahCache[no] = data[no];
          return surahCache[no];
        });
    }

    function applySettings(newSettings) {
      if (!newSettings) return;
      settings = newSettings;
      document.body.style.setProperty('--verse-size', settings.verseSize + 'px');
      document.body.style.setProperty('--surah-size', settings.surahSize + 'px');
      document.body.style.setProperty('--trans-size', settings.transSize + 'px');
      document.body.style.setProperty('--line-height', settings.lineHeight);
      document.body.style.setProperty('--overlay-width', settings.overlayWidth + 'vw');
      document.body.style.setProperty('--overlay-padding', settings.overlayPadding + 'px ' + (settings.overlayPadding * 1.6) + 'px');
      document.body.style.setProperty('--text-align', settings.textAlign);
      document.body.style.setProperty('--vertical-align', settings.verticalAlign);
      document.body.style.setProperty('--trans-display', settings.transDisplay);
      document.body.style.setProperty('--highlight-color', settings.highlightColor || '#FFD166');
    }

    function renderVerse(sNo, aNo, pNo, wIndex, status) {
      currentWordIndex = (wIndex !== undefined) ? wIndex : -1;
      const readingStatus = status || 'correct';
      loadSurah(sNo).then(sData => {
        if (!sData) return;
        
        const fullText = sData.text[aNo];
        const fullTrans = sData.translations[settings.transLang]?.text[aNo] || "";
        
        const words = fullText.trim().split(/\s+/).filter(w => w.length > 0 && !/^[ۖۗۘۙۚۛ]$/.test(w));
        const transWords = fullTrans.trim().split(/\s+/).filter(w => w.length > 0);
        const maxWords = parseInt(settings.maxWords);
        
        let verseParts = [];
        const waqfSigns = /[ۖۗۘۙۚۛ]/g;

        if (maxWords === 0 && waqfSigns.test(fullText)) {
          // Smart Grouped Waqf Split
          const rawSegments = fullText.split(/(?<=[ۖۗۘۙۚۛ])/g);
          const threshold = 18; // Maksimal kata per tampilan jika smart waqf aktif
          let currentPartText = "";

          rawSegments.forEach(segment => {
            const segmentWords = segment.trim().split(/\s+/).filter(w => w.length > 0 && !/^[ۖۗۘۙۚۛ]$/.test(w));
            const currentWords = currentPartText.trim().split(/\s+/).filter(w => w.length > 0 && !/^[ۖۗۘۙۚۛ]$/.test(w));
            
            if (currentPartText === "") {
              currentPartText = segment;
            } else if (currentWords.length + segmentWords.length <= threshold) {
              currentPartText += " " + segment;
            } else {
              verseParts.push({ text: currentPartText.trim(), trans: fullTrans });
              currentPartText = segment;
            }
          });
          if (currentPartText.trim()) {
            verseParts.push({ text: currentPartText.trim(), trans: fullTrans });
          }
        } else if (maxWords > 0 && words.length > maxWords) {
          const numParts = Math.ceil(words.length / maxWords);
          for (let i = 0; i < numParts; i++) {
            verseParts.push({
              text: words.slice(i * maxWords, (i + 1) * maxWords).join(' '),
              trans: transWords.slice(i * maxWords, (i + 1) * maxWords).join(' ')
            });
          }
        } else {
          verseParts = [{ text: fullText, trans: fullTrans }];
        }

        const currentPart = verseParts[pNo] || verseParts[0];
        
        // Menghitung startIdx global untuk bagian ini
        let startIdx = 0;
        for (let i = 0; i < pNo; i++) {
          startIdx += verseParts[i].text.trim().split(/\s+/).filter(w => w.length > 0 && !/^[ۖۗۘۙۚۛ]$/.test(w)).length;
        }

        let headerText = `${sData.name_latin} (${sNo}):${aNo}`;
        if (verseParts.length > 1) {
          headerText += ` [${parseInt(pNo) + 1}/${verseParts.length}]`;
        }
        elSurah.textContent = headerText;
        
        // Bagian 2: Ayat dengan Highlight
        elVerse.innerHTML = '';
        currentWordIndex = parseInt(wIndex !== undefined ? wIndex : -1);
        const readingStatus = status || 'correct';
        
        let currentWordCounter = 0;
        currentPart.text.trim().split(/\s+/).filter(w => w.length > 0).forEach((word) => {
          const isStandaloneWaqf = /^[ۖۗۘۙۚۛ]$/.test(word);
          const span = document.createElement('span');
          span.textContent = word + ' ';
          
          if (!isStandaloneWaqf) {
            const globalIdx = startIdx + currentWordCounter;
            if (globalIdx <= currentWordIndex) {
              span.classList.add('reading');
              if (globalIdx == currentWordIndex && readingStatus === 'wrong') {
                span.classList.add('wrong');
              }
            }
            currentWordCounter++;
          }
          elVerse.appendChild(span);
        });

        elTrans.textContent = currentPart.trans;
      });
    }

    function pollSync() {
      if (isPolling) return;
      isPolling = true;
      fetch('/sync?_t=' + Date.now())
        .then(res => res.json())
        .then(state => {
          if (state && state.t > lastSyncTime) {
            lastSyncTime = state.t;
            applySettings(state.settings);
            renderVerse(state.s, state.a, state.p, state.wi, state.st);
            if (state.v) overlay.classList.remove('hidden');
            else overlay.classList.add('hidden');
          }
        })
        .finally(() => {
          isPolling = false;
          setTimeout(pollSync, 300);
        });
    }

    init();
  </script>
</body>
</html>
